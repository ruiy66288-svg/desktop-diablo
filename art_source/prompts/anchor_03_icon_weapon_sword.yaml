  - file: "art_source/rejected/anchor_03_icon_weapon_sword/gen_01_1759d6fee8a49f2f_R-MASS.png"
    codes: ["R-MASS"]
    reason: "Gen-01 ink black was 66.08% (>50% icon cap) because the lower-right blade half, grip, and thick black border left only 32.4% bone-white."
    fix: "Made the wide broad-bladed greatsword predominantly bright warm bone-white (~58% flat bone-white across the wide blade face, crossguard, and pommel ring) with a crisp moderate black contour and narrow lower-right shadow bevel so ink-black stays cleanly within 34%-46%."

subject_prompt: >-
  Square 1:1 icon composition. A single wide-bladed medieval greatsword weapon base item, placed diagonally at
  a 45-degree angle from the wheel pommel at the bottom-left to the broad blade point at the top-right,
  centered with clear empty medium gray margin around all four corners (occupying about 82% of the square
  frame, never touching any edge). Bright bone-white-dominant coarse woodcut icon: about 58% to 64% of the
  sword's interior area is wide, open, flat unshaded warm bone-white lit steel across almost the entire broad
  blade face, wide straight crossguard, ribbed grip highlights, and wheel pommel face, paired with a crisp
  closed deep ink-black outer contour, a clean central black fuller groove, and a narrow solid ink-black
  shadow edge along the lower-right side (~36% to 44% total black ink; only 3 or 4 sparse bold woodcut gouge
  notches, NOT half-black blade shading). A small geometric gold-leaf coin-clasp sits at the center of the
  crossguard (~3% area), and a small muted crimson-ink faceted stone sits in the pommel (~3% area).

hard_constraints: >-
  Completely flat, uniform medium gray (#808080) background with nothing else—strictly NO square slot frame,
  NO border, NO bone-white paper backdrop, NO drop shadow, NO glow. Keep warm bone-white clearly dominant over
  black (~60% bone-white vs ~40% ink-black) so the broad blade gleams brightly in bone-white at 48x48 and 28x28
  sizes without turning dark or gray. Strictly NO smooth metallic gradients, NO gray fills inside the sword,
  NO fine hatching lines, and ZERO runes, letters, text, or symbols.
