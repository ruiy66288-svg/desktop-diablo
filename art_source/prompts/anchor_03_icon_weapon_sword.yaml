subject_prompt: >-
  Square 1:1 icon composition. A single heavy medieval broadsword weapon base item, placed diagonally at a
  45-degree angle from the pommel at the bottom-left to the broad blade point at the top-right, centered and
  covering about 85% of the diagonal (occupying roughly 82% of the square frame). Render as an extra-bold
  coarse relief woodcut print icon with a thick closed deep ink-black outer contour, stark flat bone-white
  upper-left lit blade bevel, and solid ink-black lower-right fuller and shadow bevel (35% to 45% black mass).
  All steel and iron surfaces of the blade, straight crossguard, and heavy wheel pommel are depicted strictly
  by bold, wide-spaced parallel woodcut chisel gouge bands—zero smooth tonal gradients. A tiny gold-leaf
  gilding motif is limited to a geometric coin-shaped rivet clasp at the center of the crossguard (under 6%
  area), and a single small muted crimson-ink faceted pommel stone provides the tiny accent (under 5% area).

hard_constraints: >-
  Completely flat, uniform medium gray (#808080) background with nothing else—strictly NO square slot frame,
  NO border, NO bone-white paper backdrop, NO drop shadow, NO aura or sparkles. Every woodcut stroke must be
  extra-thick so the sword silhouette and fuller remain razor-clear when downsampled to 48x48 equipment slot
  and 28x28 ground loot icon sizes without turning muddy gray. Strictly NO smooth mobile-game metallic
  gradients, NO shiny specular highlights, and ZERO runes, engravings of letters, text, or symbols on the blade.
