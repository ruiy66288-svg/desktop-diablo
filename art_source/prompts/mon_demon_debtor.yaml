  cropped at top, bottom, or sides; hooves floating cleanly in mid-air with zero ground strip beneath them).
  Arms and legs are clearly separated from the lean torso with open gray negative space between limbs so the
  silhouette reads cleanly at 72x90 pixel scale. One dominant silhouette feature only: a pair of tall
  upward-swept goat-demon horns (no wings, no tail breaking the silhouette, no wide cloak). Bright
  bone-white-dominant relief woodcut: about 55% to 60% of the figure's interior is wide, clean, flat unshaded
  warm bone-white carved surfaces across the horns, skull-like fiend face, broad chest, forearms, thighs,
  shin greaves, and rolled parchment scroll (leave lit bone-white planes clean and solid white without dense
  black hatching stripes), balanced against crisp deep ink-black contours and selective bold black shadow
  recesses (~38% to 46% total black ink). Wealth corruption motif: heavy gold-leaf padlocked debt chains
  shackled to wrist cuffs and a tightly rolled blank contract scroll sealed with a plain round gold wax disc
  at the hip (~6% gold-leaf area). One tiny muted dark blood-crimson ink accent strictly limited to a small
  torn loincloth sash knot (~3% area).

hard_constraints: >-
  Isolated full-body subject floating on a completely flat, uniform medium gray (#808080) background—strictly
