subject_prompt: >-
  Vertical portrait composition for a 4:5 master ratio. A single skeletal miser revenant of the Undead
  family, front-facing in a symmetrical iconic tarot standing pose, full body visible from crown tip to
  skeletal feet, centered horizontally, filling about 86% of the image height with feet resting near the
  92% height line. Arms and legs are clearly separated from the ribcage and pelvis so the outer silhouette
  reads cleanly at small 72x90 pixel scale. One dominant silhouette feature only: a tall jagged bone crown
  atop the skull (no wings, no horns, no oversized cape). Wealth corruption motif: one heavy gold coin
  wedged tightly into the left eye socket and two bulging coin pouches bound across the ribcage with thick
  iron links, rendered as flat gold-leaf gilding covering no more than 8% of the body. Tiny muted old-ochre
  ink accent strictly limited to a small torn burial sash knot at the waist (under 5% area). Tattered cloth
  and bone surfaces use extra-bold, wide-spaced woodcut chisel gouges and large solid ink-black shadow blocks
  (40% to 50% black mass); any iron shoulder plates are shown solely by coarse parallel horizontal gouge cuts.

hard_constraints: >-
  Isolated subject floating on a completely flat, uniform medium gray (#808080) background—strictly NO
  bone-white paper card background, NO tarot card frame, NO archway, NO ground shadow. Strictly NO fine
  copperplate engraving lines or dense thin hatching on cloth or bone (every carved stroke must be thick and
  bold so it stays crisp at 72px height without turning muddy gray). Strictly NO smooth metallic shading or
  specular highlights. Strictly NO text, letters, numbers, runes, symbols, seals with writing, or borders.
