    fix: "Removed gray iron shoulder pauldrons in favor of broad flat bone-white carved skull, crown, sternum breast-bone plate, wide bone-white burial tunic, and thick limb bones so warm bone-white covers ~56% of the figure and ink-black stays cleanly within 38%-50%."

subject_prompt: >-
  Vertical portrait composition for a 4:5 master ratio. A single sturdy skeletal miser revenant of the Undead
  family, front-facing in a symmetrical iconic tarot standing pose, full body completely visible from crown
  tip to skeletal feet with generous empty flat medium gray (#808080) margin on all four sides (never cropped
  at top or bottom, feet floating cleanly in mid-air with zero ground strip beneath them). Arms and legs are
  clearly separated from the torso with open gray negative space between limbs so the silhouette reads cleanly
  at small 72x90 pixel scale. One dominant silhouette feature only: a tall broad jagged bone crown atop the
  skull (no wings, no horns, no cape). Bright bone-white-dominant relief woodcut: about 55% to 60% of the
  figure's interior is wide, continuous, flat unshaded warm bone-white carved surfaces—broad bone crown, bold
  bone skull, wide fused bone sternum plate and thick wide ribs, broad ragged bone-white burial kilt, and
  chunky thick arm and leg bones—so black ink outlines and shadow recesses total only about 38% to 46% of the
  figure. Wealth corruption motif: one heavy gold coin wedged tightly into the left eye socket and two bulging
  coin pouches chained across the chest, rendered as flat gold-leaf gilding covering about 7% of the body. One
  tiny muted oxidized bronze-olive ink accent strictly limited to a small burial sash knot at the waist (under
  3% area).

hard_constraints: >-
  Isolated full-body subject floating on a completely flat, uniform medium gray (#808080) background—strictly
  NO bone-white paper card background, NO tarot card frame, NO ground line, NO floor strip, NO drop shadow.
  Strictly NO gray-shaded metal shoulder pads (every surface must be pure warm bone-white, pure ink-black, flat
  gold-leaf, or the tiny sash accent—zero gray fills inside the character!). Keep warm bone-white planes wide,
  chunky, and dominant (~58% white vs ~40% black) with ZERO fine thin hatching so 72x90 thumbnail contrast stays
  razor-sharp. Strictly NO text, letters, numbers, runes, coin inscriptions, or symbols.
