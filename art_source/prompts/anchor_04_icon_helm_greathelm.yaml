subject_prompt: >-
  Square 1:1 icon composition. A single forged iron knightly great helm armor base item, shown in a front
  three-quarter (3/4) view with the visor faceplate oriented toward the front-left, centered with generous
  empty medium gray margin around all four sides (occupying about 80% of the square frame, never touching any
  border). Bright bone-white-dominant coarse woodcut icon: about 56% to 62% of the helmet's interior is broad,
  clean, flat unshaded warm bone-white lit iron plates across the entire crown dome, brow band, nasal strip,
  left cheek plate, and gorget rim (leave the lit bone-white plates clean and solid white without dense dark
  stripes), balanced against a bold closed deep ink-black outer contour, stark black T-shaped visor slits, and
  4 or 5 thick wide-spaced horizontal parallel woodcut chisel shadow gouges on the far right cheek (~36% to
  44% total black ink). Wealth motif: a small geometric gold-leaf padlock-shaped rivet clasp on the nasal
  bridge (~3% area), paired with one tiny muted burgundy-ink diamond inlay above the visor (~2% area).

hard_constraints: >-
  Completely flat, uniform medium gray (#808080) background with nothing else—strictly NO icon frame, NO
  border, NO bone-white paper background, NO glow. Keep warm bone-white plates broad, clean, and dominant (~60%
  bone-white vs ~40% ink-black)—do NOT cover the dome or left cheek with dense black hatching stripes, and NO
  gray midtone shading. Strictly ZERO text, letters, numbers, runes, heraldic inscriptions, or symbols.
