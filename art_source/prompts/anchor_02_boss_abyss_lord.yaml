subject_prompt: >-
  Vertical portrait composition for a 4:5 master ratio. Make it a towering boss seen from a slightly low
  upward camera angle (about 10 degrees), broad armored shoulders spanning over 72% of the frame width,
  full body from horn tips to clawed hooves centered horizontally and filling about 92% of the image height.
  Depict the Abyssal Archfiend of the Demon family in a commanding symmetrical front-facing tarot stance with
  limbs clearly separated from the torso. Two dominant silhouette features: massive sweeping curved ram-demon
  horns framing a jagged iron crown. Heavier solid ink-black shadow masses covering 52% to 58% of the figure.
  Wealth corruption motif: thick padlocked debt chains criss-crossing the chest plate and a heavy closed blank
  ledger bound by a large geometric gold padlock at the belt, rendered as flat gold-leaf gilding covering no
  more than 10% of the body. One small muted dark blood-crimson ink accent restricted to the inner fold of the
  torn waist mantle (under 8% area). Heavy breastplate, gauntlets, and mantle folds are carved exclusively with
  bold, wide-spaced parallel woodcut chisel gouges and stark flat bone-white lit planes from the upper left.

hard_constraints: >-
  Isolated subject on a completely flat, uniform medium gray (#808080) background—strictly NO bone-white card
  paper background, NO gothic arch frame, NO background halo (arch and sigil ring are drawn procedurally in
  Godot). Strictly NO fine copperplate hatching on cloak, fur, or horns that would blur into gray at 72x90px.
  Armor and metal surfaces must have ZERO smooth gradients and ZERO metallic highlights—use only coarse parallel
  horizontal woodcut gouge bands. The closed debt ledger and seals must be 100% blank geometric shapes with
  ZERO text, letters, pseudo-runes, script, numbers, or symbols anywhere in the image.
