subject_prompt: >-
  Vertical portrait composition for a 4:5 master ratio. Make it a towering boss seen from a slightly low
  upward camera angle (about 10 degrees), broad armored shoulders spanning about 72% of the frame width,
  full body completely visible from horn tips to clawed hooves with clear empty flat medium gray (#808080)
  margin on all four sides (never cropped at top, bottom, or sides; hooves floating cleanly in mid-air with
  zero ground strip beneath them). Depict the Abyssal Archfiend of the Demon family in a commanding symmetrical
  front-facing tarot stance with arms and legs clearly separated from the torso (no floor-length cape). Two
  dominant silhouette features: massive sweeping curved ram-demon horns framing a jagged iron crown. Strict
  54%-black / 40%-bone-white balance: large, broad, clean flat warm bone-white lit surfaces cover the upper
  surfaces of both horns, the broad chestplate, massive tiered pauldrons, gauntlets, armored thigh tassets,
  and shin greaves (keep lit bone-white armor plates wide and mostly solid white with only 2 or 3 thick coarse
  horizontal chisel cuts per plate rather than dense stripes), balanced against bold solid deep ink-black
  shadow recesses (~54% total black ink). Wealth corruption motif: thick padlocked gold-leaf debt chains
  criss-crossing the chest and a closed blank geometric gold-bound ledger padlocked at the belt (~6% gold-leaf
  area). One small muted dark blood-crimson ink accent on the inner fold of the short waist mantle (~3% area).

hard_constraints: >-
  Isolated full-body subject on a completely flat, uniform medium gray (#808080) background—strictly NO
  bone-white card paper background, NO gothic arch frame, NO ground line, NO floor strip. Keep lit bone-white
  armor plates wide and open so total black ink stays strictly between 50% and 58% (do NOT over-fill lit armor
  plates with dense black stripes, and NO gray midtone fills inside the figure). Armor and metal surfaces must
  have ZERO smooth gradients and ZERO metallic highlights. The closed debt ledger must be 100% blank geometric
  shapes with ZERO text, letters, pseudo-runes, script, numbers, or symbols anywhere.
