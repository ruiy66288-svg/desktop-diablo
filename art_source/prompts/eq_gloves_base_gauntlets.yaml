subject_prompt: >-
  Square 1:1 icon composition. A single heavy medieval articulated iron plate gauntlet glove base item (one
  single gauntlet only, NOT a pair), shown in a dorsal three-quarter (3/4) view angled diagonally from the
  flared wrist cuff at the lower-left to the five armored fingers pointing clearly toward the upper-right,
  centered with generous empty medium gray margin on all four sides (occupying about 80% of the square frame,
  never touching any edge; angle the cuff from above so no large black hollow wrist hole is visible). Very
  bright bone-white-dominant coarse woodcut icon: at least 62% to 66% of the gauntlet's interior is wide,
  clean, solid unshaded warm bone-white lit iron plates across the entire flared cuff, wrist band, back-of-hand
  plate, thumb, and all five finger lames (zero comb-teeth hatching along finger edges!), with crisp deep
  ink-black outer contour and plate joint lines totaling only ~34% to 42% black ink. Wealth motif: a geometric
  gold-leaf coin-seal clasp on the wrist band (~4% area), plus a distinct muted forest-moss-green gemstone
  cabochon set into the center of the dorsal hand plate (~3% area).

hard_constraints: >-
  Completely flat, uniform medium gray (#808080) background with nothing else—strictly a SINGLE gauntlet (do
  NOT draw two gloves), NO large black cuff hole, NO icon border, NO bone-white paper backdrop, NO glow. Keep
  solid warm bone-white plates clearly dominant (~64% bone-white vs ~34% ink-black)—do NOT add comb hatching
  ticks along every finger segment! Strictly ZERO text, letters, numbers, runes, or symbols.
