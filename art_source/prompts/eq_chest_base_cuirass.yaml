subject_prompt: >-
  Square 1:1 icon composition. A single heavy medieval forged-iron plate cuirass chest armor base item, shown
  in a strict symmetrical front view with a strong horizontal pauldrons-and-shoulder line and segmented waist
  faulds, centered with generous empty medium gray margin on all four sides (occupying about 80% of the square
  frame, never touching any edge). Bright bone-white-dominant coarse woodcut icon: about 56% to 62% of the
  cuirass interior is wide, clean, flat unshaded warm bone-white lit iron plates across the broad breastplate,
  both horizontal shoulder pauldrons, and upper waist lames (leave the lit bone-white armor plates wide and
  solid white without dense black stripes), balanced against a bold closed deep ink-black outer contour, dark
  neck/armhole recesses, and 4 or 5 sparse thick horizontal parallel woodcut chisel shadow gouges along the
  lower-right side (~36% to 44% total black ink). Wealth motif: a small geometric gold-leaf padlock clasp on
  the center sternum ridge (~4% area), paired with one tiny muted crimson-ink gorget gem rivet at the collar
  (~2% area).

hard_constraints: >-
  Completely flat, uniform medium gray (#808080) background with nothing else—strictly NO icon frame, NO
  border, NO mannequin stand, NO bone-white paper backdrop, NO glow. Keep warm bone-white armor plates wide,
  clean, and dominant (~60% bone-white vs ~40% ink-black)—do NOT fill the chestplate with dense black stripes,
  and NO gray midtone shading. Strictly ZERO heraldic crests, text, letters, runes, or symbols.
