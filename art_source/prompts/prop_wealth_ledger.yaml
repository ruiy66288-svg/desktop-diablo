# 《桌面破坏神》WP-P2-ART 正式资产提示词卡 #17: 财富契约道具插图 — 金币堆与债契账簿 (prop_wealth_ledger)
# 依据: docs/03 §02.4 | docs/04 §3 #5 (96x96 四通道财富道具插画，镀金 B <= 12%)
