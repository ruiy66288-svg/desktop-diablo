subject_prompt: >-
  Square 1:1 icon composition. A single compact still-life emblem of a thick closed medieval debt-covenant ledger
  book bound in carved bone-parchment boards with heavy iron corner straps and a front padlock clasp, accompanied
  by one small neat stack of four chunky blank gold coins tucked tightly against its lower-right corner (forming
  one cohesive connected silhouette), shown in three-quarter (3/4) perspective centered on a flat medium gray
  (#808080) background (occupying about 80% of the square frame, never touching any edge). Bright
  bone-white-dominant coarse woodcut icon: about 56% to 62% of the emblem's opaque area is wide, clean, flat
  unshaded warm bone-white carved surfaces across the broad front book board, thick closed page-edge block, and
  raised spine bands, balanced against thick deep ink-black contours and bold black iron strap shadows (~36% to
  44% total black ink). Wealth motif strictly capped under 9% area: bright gold-leaf ONLY on the small front
  padlock clasp and the compact 4-coin stack at the corner (the entire book cover and pages are warm bone-white,
  NOT gold). A small dark blood-crimson blank ribbon bookmark tab peeks from the bottom page edge (~3% area).

hard_constraints: >-
  Completely flat, uniform medium gray (#808080) background—strictly NO table surface, NO ground shadow, NO loose
  scattered coins detached from the book, NO icon frame. Keep warm bone-white book boards wide and dominant (~58%
  bone-white vs ~40% ink-black), keep gold-leaf strictly small (<9% area), and ZERO gray midtone fills. The book
  cover and coins must be 100% blank geometric shapes with ZERO text, title letters, numbers, or symbols.
